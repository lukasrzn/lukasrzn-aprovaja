openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: AprovaJá API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: users
  - name: gamification
  - name: study-plans
  - name: flashcards
  - name: simulados
  - name: redacao
  - name: rankings
  - name: missions
  - name: dashboard
  - name: questions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    patch:
      operationId: updateMe
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /gamification/stats:
    get:
      operationId: getGamificationStats
      tags: [gamification]
      responses:
        "200":
          description: Gamification stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GamificationStats"

  /gamification/medals:
    get:
      operationId: getMedals
      tags: [gamification]
      responses:
        "200":
          description: Medals list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Medal"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/performance:
    get:
      operationId: getPerformanceData
      tags: [dashboard]
      responses:
        "200":
          description: Performance data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PerformancePoint"

  /dashboard/weak-subjects:
    get:
      operationId: getWeakSubjects
      tags: [dashboard]
      responses:
        "200":
          description: Weak subjects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubjectScore"

  /study-plans:
    get:
      operationId: getStudyPlans
      tags: [study-plans]
      responses:
        "200":
          description: Study plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudyPlan"
    post:
      operationId: createStudyPlan
      tags: [study-plans]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudyPlanInput"
      responses:
        "201":
          description: Created study plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyPlan"

  /study-plans/{id}:
    get:
      operationId: getStudyPlan
      tags: [study-plans]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Study plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyPlan"
    patch:
      operationId: updateStudyPlan
      tags: [study-plans]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudyPlanUpdate"
      responses:
        "200":
          description: Updated study plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyPlan"
    delete:
      operationId: deleteStudyPlan
      tags: [study-plans]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /study-plans/{id}/sessions:
    get:
      operationId: getStudySessions
      tags: [study-plans]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Study sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudySession"
    post:
      operationId: createStudySession
      tags: [study-plans]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudySessionInput"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudySession"

  /flashcards:
    get:
      operationId: getFlashcards
      tags: [flashcards]
      responses:
        "200":
          description: Flashcard decks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlashcardDeck"
    post:
      operationId: createFlashcardDeck
      tags: [flashcards]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlashcardDeckInput"
      responses:
        "201":
          description: Created deck
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlashcardDeck"

  /flashcards/{deckId}/cards:
    get:
      operationId: getFlashcardCards
      tags: [flashcards]
      parameters:
        - name: deckId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Flashcards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Flashcard"
    post:
      operationId: createFlashcard
      tags: [flashcards]
      parameters:
        - name: deckId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlashcardInput"
      responses:
        "201":
          description: Created flashcard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flashcard"

  /flashcards/{deckId}/cards/{cardId}/review:
    post:
      operationId: reviewFlashcard
      tags: [flashcards]
      parameters:
        - name: deckId
          in: path
          required: true
          schema:
            type: integer
        - name: cardId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlashcardReview"
      responses:
        "200":
          description: Review recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flashcard"

  /simulados:
    get:
      operationId: getSimulados
      tags: [simulados]
      responses:
        "200":
          description: Mock exams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Simulado"
    post:
      operationId: createSimulado
      tags: [simulados]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimuladoInput"
      responses:
        "201":
          description: Created simulado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Simulado"

  /simulados/recent-results:
    get:
      operationId: getRecentSimuladoResults
      tags: [simulados]
      responses:
        "200":
          description: Recent results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SimuladoResult"

  /simulados/{id}:
    get:
      operationId: getSimulado
      tags: [simulados]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Simulado detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimuladoDetail"

  /simulados/{id}/start:
    post:
      operationId: startSimulado
      tags: [simulados]
      summary: Start a simulado session, returns questions from question bank
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartSimuladoInput"
      responses:
        "200":
          description: Exam session with questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamSession"

  /simulados/{id}/submit:
    post:
      operationId: submitSimulado
      tags: [simulados]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimuladoAnswers"
      responses:
        "200":
          description: Simulado result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimuladoResult"

  /redacoes:
    get:
      operationId: getRedacoes
      tags: [redacao]
      responses:
        "200":
          description: Essays
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Redacao"
    post:
      operationId: submitRedacao
      tags: [redacao]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedacaoInput"
      responses:
        "201":
          description: Submitted essay with AI feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Redacao"

  /redacoes/{id}:
    get:
      operationId: getRedacao
      tags: [redacao]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Essay detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Redacao"

  /rankings/global:
    get:
      operationId: getGlobalRanking
      tags: [rankings]
      responses:
        "200":
          description: Global ranking
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RankingEntry"

  /rankings/weekly:
    get:
      operationId: getWeeklyRanking
      tags: [rankings]
      responses:
        "200":
          description: Weekly ranking
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RankingEntry"

  /missions/today:
    get:
      operationId: getTodayMissions
      tags: [missions]
      responses:
        "200":
          description: Today's missions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Mission"

  /missions/{id}/complete:
    post:
      operationId: completeMission
      tags: [missions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Completed mission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mission"

  # ── Questions ──────────────────────────────────────────────────────────────
  /questions:
    get:
      operationId: getQuestions
      tags: [questions]
      summary: List questions with optional filters
      parameters:
        - name: subject
          in: query
          schema:
            type: string
        - name: topic
          in: query
          schema:
            type: string
        - name: difficulty
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Questions list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionsPage"
    post:
      operationId: createQuestion
      tags: [questions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionInput"
      responses:
        "201":
          description: Created question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionWithAnswer"

  /questions/subjects:
    get:
      operationId: getQuestionSubjects
      tags: [questions]
      summary: Get list of distinct subjects and their question counts
      responses:
        "200":
          description: Subjects list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubjectSummary"

  /questions/{id}:
    get:
      operationId: getQuestion
      tags: [questions]
      summary: Get a single question including correct answer and explanation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Question with answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionWithAnswer"

  /questions/{id}/practice:
    post:
      operationId: practiceQuestion
      tags: [questions]
      summary: Answer a single question in practice mode
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PracticeAnswer"
      responses:
        "200":
          description: Practice result with explanation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        avatarUrl:
          type: ["string", "null"]
        goal:
          type: string
        school:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, name, email, goal, createdAt]

    UserProfileUpdate:
      type: object
      properties:
        name:
          type: string
        avatarUrl:
          type: ["string", "null"]
        goal:
          type: string
        school:
          type: ["string", "null"]

    GamificationStats:
      type: object
      properties:
        xp:
          type: integer
        level:
          type: integer
        xpToNextLevel:
          type: integer
        streak:
          type: integer
        coins:
          type: integer
        rank:
          type: integer
        totalStudyMinutes:
          type: integer
        medalsEarned:
          type: integer
      required: [xp, level, xpToNextLevel, streak, coins, rank, totalStudyMinutes, medalsEarned]

    Medal:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        icon:
          type: string
        earned:
          type: boolean
        earnedAt:
          type: ["string", "null"]
        rarity:
          type: string
      required: [id, name, description, icon, earned, rarity]

    DashboardSummary:
      type: object
      properties:
        studyMinutesToday:
          type: integer
        questionsAnsweredToday:
          type: integer
        simuladosCompleted:
          type: integer
        flashcardsReviewedToday:
          type: integer
        currentStreak:
          type: integer
        xpThisWeek:
          type: integer
        nextMilestone:
          type: string
      required: [studyMinutesToday, questionsAnsweredToday, simuladosCompleted, flashcardsReviewedToday, currentStreak, xpThisWeek, nextMilestone]

    PerformancePoint:
      type: object
      properties:
        date:
          type: string
        xpEarned:
          type: integer
        minutesStudied:
          type: integer
        questionsCorrect:
          type: integer
        questionsTotal:
          type: integer
      required: [date, xpEarned, minutesStudied, questionsCorrect, questionsTotal]

    SubjectScore:
      type: object
      properties:
        subject:
          type: string
        score:
          type: number
        totalQuestions:
          type: integer
        correctAnswers:
          type: integer
        trend:
          type: string
      required: [subject, score, totalQuestions, correctAnswers, trend]

    StudyPlan:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        goal:
          type: string
        targetDate:
          type: ["string", "null"]
        subjects:
          type: array
          items:
            type: string
        hoursPerDay:
          type: number
        progress:
          type: number
        createdAt:
          type: string
      required: [id, title, goal, subjects, hoursPerDay, progress, createdAt]

    StudyPlanInput:
      type: object
      properties:
        title:
          type: string
        goal:
          type: string
        targetDate:
          type: ["string", "null"]
        subjects:
          type: array
          items:
            type: string
        hoursPerDay:
          type: number
      required: [title, goal, subjects, hoursPerDay]

    StudyPlanUpdate:
      type: object
      properties:
        title:
          type: string
        goal:
          type: string
        targetDate:
          type: ["string", "null"]
        subjects:
          type: array
          items:
            type: string
        hoursPerDay:
          type: number

    StudySession:
      type: object
      properties:
        id:
          type: integer
        planId:
          type: integer
        subject:
          type: string
        durationMinutes:
          type: integer
        notes:
          type: ["string", "null"]
        xpEarned:
          type: integer
        createdAt:
          type: string
      required: [id, planId, subject, durationMinutes, xpEarned, createdAt]

    StudySessionInput:
      type: object
      properties:
        subject:
          type: string
        durationMinutes:
          type: integer
        notes:
          type: ["string", "null"]
      required: [subject, durationMinutes]

    FlashcardDeck:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        subject:
          type: string
        cardCount:
          type: integer
        dueCount:
          type: integer
        masteredCount:
          type: integer
        createdAt:
          type: string
      required: [id, title, subject, cardCount, dueCount, masteredCount, createdAt]

    FlashcardDeckInput:
      type: object
      properties:
        title:
          type: string
        subject:
          type: string
      required: [title, subject]

    Flashcard:
      type: object
      properties:
        id:
          type: integer
        deckId:
          type: integer
        front:
          type: string
        back:
          type: string
        easeFactor:
          type: number
        interval:
          type: integer
        repetitions:
          type: integer
        nextReviewAt:
          type: ["string", "null"]
        mastered:
          type: boolean
      required: [id, deckId, front, back, easeFactor, interval, repetitions, mastered]

    FlashcardInput:
      type: object
      properties:
        front:
          type: string
        back:
          type: string
      required: [front, back]

    FlashcardReview:
      type: object
      properties:
        quality:
          type: integer
      required: [quality]

    Simulado:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        type:
          type: string
        subject:
          type: ["string", "null"]
        questionCount:
          type: integer
        durationMinutes:
          type: integer
        difficulty:
          type: string
        completedAt:
          type: ["string", "null"]
        score:
          type: ["number", "null"]
        createdAt:
          type: string
      required: [id, title, type, questionCount, durationMinutes, difficulty, createdAt]

    SimuladoInput:
      type: object
      properties:
        title:
          type: string
        type:
          type: string
        subject:
          type: ["string", "null"]
        difficulty:
          type: string
        questionCount:
          type: integer
      required: [title, type, difficulty]

    StartSimuladoInput:
      type: object
      properties:
        subject:
          type: ["string", "null"]
          description: Filter questions by subject
        difficulty:
          type: ["string", "null"]
          description: Filter questions by difficulty
      required: []

    SimuladoDetail:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        type:
          type: string
        difficulty:
          type: string
        durationMinutes:
          type: integer
        questions:
          type: array
          items:
            $ref: "#/components/schemas/Question"
      required: [id, title, type, difficulty, durationMinutes, questions]

    ExamSession:
      type: object
      properties:
        sessionId:
          type: integer
        simuladoId:
          type: integer
        title:
          type: string
        durationMinutes:
          type: integer
        difficulty:
          type: string
        questions:
          type: array
          items:
            $ref: "#/components/schemas/ExamQuestion"
      required: [sessionId, simuladoId, title, durationMinutes, difficulty, questions]

    ExamQuestion:
      type: object
      properties:
        id:
          type: integer
        subject:
          type: string
        topic:
          type: string
        statement:
          type: string
        contextText:
          type: ["string", "null"]
        difficulty:
          type: string
        estimatedTimeSeconds:
          type: integer
        alternatives:
          type: array
          items:
            $ref: "#/components/schemas/Alternative"
      required: [id, subject, topic, statement, difficulty, estimatedTimeSeconds, alternatives]

    Question:
      type: object
      properties:
        id:
          type: integer
        text:
          type: string
        subject:
          type: string
        alternatives:
          type: array
          items:
            $ref: "#/components/schemas/Alternative"
      required: [id, text, subject, alternatives]

    Alternative:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
      required: [id, text]

    SimuladoAnswers:
      type: object
      properties:
        answers:
          type: array
          items:
            $ref: "#/components/schemas/AnswerItem"
        timeSpentSeconds:
          type: integer
      required: [answers]

    AnswerItem:
      type: object
      properties:
        questionId:
          type: integer
        selectedAlternative:
          type: string
      required: [questionId, selectedAlternative]

    SimuladoResult:
      type: object
      properties:
        id:
          type: integer
        simuladoId:
          type: integer
        simuladoTitle:
          type: string
        score:
          type: number
        correctCount:
          type: integer
        totalCount:
          type: integer
        xpEarned:
          type: integer
        timeSpentMinutes:
          type: integer
        completedAt:
          type: string
        subjectBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/SubjectScore"
        triScore:
          type: ["number", "null"]
        questionResults:
          type: array
          items:
            $ref: "#/components/schemas/QuestionResult"
      required: [id, simuladoId, simuladoTitle, score, correctCount, totalCount, xpEarned, timeSpentMinutes, completedAt, subjectBreakdown]

    QuestionResult:
      type: object
      properties:
        questionId:
          type: integer
        subject:
          type: string
        topic:
          type: string
        selectedAlternative:
          type: string
        correctAnswer:
          type: string
        isCorrect:
          type: boolean
        explanation:
          type: string
      required: [questionId, subject, topic, selectedAlternative, correctAnswer, isCorrect, explanation]

    Redacao:
      type: object
      properties:
        id:
          type: integer
        theme:
          type: string
        content:
          type: string
        score:
          type: ["integer", "null"]
        maxScore:
